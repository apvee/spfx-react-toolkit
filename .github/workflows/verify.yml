name: Verify monorepo
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture exact setup-node binary
        run: echo "DOCS_NODE_BIN=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - run: npm run verify:docs-reproducibility
      - name: Require isolated-network generated artifacts check
        shell: bash
        run: |
          command -v unshare
          command -v sudo
          test -x "$DOCS_NODE_BIN"
          sudo -n unshare --net -- sh -eu -c '
            "$1" tests/fixtures/documentation/reproducibility/network-namespace-probe.cjs
            exec "$1" scripts/docs/generated.cjs --check
          ' docs-offline "$DOCS_NODE_BIN"
      - run: npm run build
      - name: Verify behavior, contracts and native demo reachability
        run: npm run verify
      - run: npm run package:solution
      - run: npm run verify:package
        env:
          SPFX_PACKAGE_EVIDENCE: .docs/maintenance/evidence/tree-shaking/ci/package
      - uses: actions/upload-artifact@v4
        with:
          name: spfx-test-solution
          path: apps/spfx-react-toolkit-test/sharepoint/solution/*.sppkg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-shaking-contract-reports
          path: .docs/maintenance/evidence/tree-shaking/
          if-no-files-found: warn
